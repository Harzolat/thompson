    <script>
      // Apply the saved theme before first paint (no light flash).
      try {
        if (localStorage.getItem('th-portfolio-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#0d0d0c');
        }
      } catch (e) {}
    </script>

    <!-- Typography: Inter (clean, modern sans-serif) -->
