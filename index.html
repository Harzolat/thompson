<!doctype html>
<!-- Dark is the default theme; the pre-paint script below applies a
     stored light preference before first paint. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thompson Harzolat — Developer, Creator & Founder of PulseLab</title>
    <meta
      name="description"
      content="Portfolio of Thompson Harzolat — Software Developer, UI/UX Designer, and Creator of PulseLab."
    />

    <!-- Favicon + PWA -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme + SEO -->
    <meta name="theme-color" content="#0d0d0c" />
    <link rel="canonical" href="https://harzolat.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Thompson Harzolat × PulseLab" />
    <meta property="og:url" content="https://harzolat.vercel.app/" />
    <meta property="og:title" content="Thompson Harzolat — Developer, Creator & Founder of PulseLab" />
    <meta
      property="og:description"
      content="Portfolio of Thompson Harzolat — Software Developer, UI/UX Designer, and Creator of PulseLab."
    />
    <meta property="og:image" content="https://harzolat.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Thompson Harzolat — Building ideas into digital experiences. Founder, Creator, Developer."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@Harzolat" />
    <meta name="twitter:title" content="Thompson Harzolat — Developer, Creator & Founder of PulseLab" />
    <meta
      name="twitter:description"
      content="Building ideas into digital experiences. Developer, creator and founder of PulseLab."
    />
    <meta name="twitter:image" content="https://harzolat.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Thompson Harzolat — Building ideas into digital experiences."
    />
    <script>
      // Dark is the default theme (html tag + theme-color meta above);
      // a stored light preference is applied before first paint so
      // there is no flash of the wrong theme.
      try {
        if (localStorage.getItem('th-portfolio-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#fafaf8');
        }
      } catch (e) {}
    </script>

    <!-- Typography: Space Grotesk (display), Inter (body + UI), Caveat
         (handwritten accents), JetBrains Mono (technical detail).
         One request, only the weights the site actually uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
